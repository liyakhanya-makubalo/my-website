<main id="main-content">

    <section class="page-hero">
        <h2>Book a Consultation</h2>
        <p>Complete the form to request a consultation.</p>
    </section>

    <section class="container">

        <h2>Consultation Request Form</h2>

        <form id="enquiry-form"
              action="https://formsubmit.co/makubaloliyakhanya@gmail.com"
              method="POST">

            <input type="hidden" name="_subject"
                   value="New Consultation Request - Lilitha's Nature Relief">

            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="true">

            <input type="text" name="_honey"
                   tabindex="-1" autocomplete="off"
                   style="display:none">

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname"
                   minlength="2" maxlength="80" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   maxlength="120" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   pattern="[+]?[0-9 ]{9,15}" required>

            <label for="consultation-type">Consultation Type</label>
            <select id="consultation-type" name="consultation_type" required>
                <option value="">Select a service</option>
                <option value="Soil Testing">Soil Testing</option>
                <option value="Smart Irrigation">Smart Irrigation</option>
                <option value="Crop Monitoring">Crop Monitoring</option>
                <option value="Greenhouse Management">Greenhouse Management</option>
                <option value="Drone Inspections">Drone Inspections</option>
                <option value="General Consultation">General Consultation</option>
            </select>

            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="preferred_date" required>

            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="preferred_time" required>

            <label for="needs">Additional Information</label>
            <textarea id="needs" name="additional_information"
                      rows="6" minlength="10"
                      maxlength="1500"
                      placeholder="Tell us more about your requirements."
                      required></textarea>

            <label class="consent-label">
                <input type="checkbox" name="consent"
                       value="Agreed" required>
                I agree that my information may be used to respond to this request.
            </label>

            <div class="form-feedback" role="status"
                 aria-live="polite"></div>

            <button type="submit">Submit Consultation Request</button>

        </form>

    </section>

</main>
